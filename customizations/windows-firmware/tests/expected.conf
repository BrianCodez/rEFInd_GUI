# GUI generated refind.conf Config File
timeout 5
use_nvram false
hideui singleuser,hints,arrows,label,badges
banner background.png
banner_scale fillscreen
resolution 3440 1440
enable_touch
#enable_mouse
log_level 0
showtools
scanfor manual
default_selection "1"

menuentry "Fedora" {
	icon /EFI/refind/os_icon1.png
	volume "2d2849d3-c328-410c-a1e4-3dda14cf3536"
	loader /EFI/fedora/shimx64.efi
	graphics on
}

menuentry "Windows" {
	icon /EFI/refind/os_icon2.png
	firmware_bootnum 0002
}
